name: phase-gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: npm install --prefix .cache/pnpm-cli --cache .cache/npm --no-audit --no-fund pnpm@12.11.2
      - run: echo "$GITHUB_WORKSPACE/.cache/pnpm-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile --state-dir .cache/pnpm-state
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:foundation:http
      - run: pnpm infra:config
      - run: pnpm infra:up
      - run: pnpm test:integration:foundation
      - run: pnpm db:migrate
      - run: pnpm test:integration:auth
      - run: pnpm test:integration:conversations
      - run: pnpm test:integration:messaging
      - run: pnpm test:integration:sync
      - run: pnpm test:failure:gateway
      - run: pnpm test:failure:outbox
      - run: pnpm infra:scanner
      - run: pnpm test:integration:attachments
      - run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      - run: pnpm test:e2e:auth
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      - run: pnpm test:e2e:conversations
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      - run: pnpm test:e2e:messaging
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      - run: pnpm test:e2e:sync
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      - run: pnpm test:e2e:attachments
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      - run: npm audit --omit=dev --audit-level=high
        working-directory: infra/processor
      - run: pnpm audit --prod --audit-level high
      - if: failure()
        run: docker --config .cache/docker compose -f infra/compose/compose.yaml logs --tail 100
      - if: always()
        run: pnpm infra:down
