# Local-only single-node dependencies. NOT a production deployment.
name: commonroom-local
services:
  mongo:
    image: mongo:8.0.32@sha256:d0d926f94df099bff534b7ee5b5986458131a22489dfff8664509af0c1e2ca9c
    command: [mongod, --replSet, rs0, --bind_ip_all, --oplogSize, '256']
    ports: ['127.0.0.1:27017:27017']
    volumes: [mongo-data:/data/db]
    healthcheck:
      # Idempotent dev-only initialization; health requires writable primary, not merely TCP.
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'try { rs.status() } catch (e) { if (e.codeName === "NotYetInitialized") rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); else throw e; } if (!db.hello().isWritablePrimary) quit(1);']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: [redis-server, --requirepass, local-only-redis-password, --maxmemory, 256mb, --maxmemory-policy, noeviction]
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH=local-only-redis-password redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine@sha256:3ef7f7e89fed709a78f79b8b5f4e30e1312a1d4089da752e23595566d9d61a95
    environment:
      RABBITMQ_DEFAULT_USER: chat
      RABBITMQ_DEFAULT_PASS: local-only-rabbit-password
      RABBITMQ_DEFAULT_VHOST: chat
    ports: ['127.0.0.1:5672:5672', '127.0.0.1:15672:15672']
    volumes: [rabbit-data:/var/lib/rabbitmq]
    healthcheck:
      test: ['CMD', rabbitmq-diagnostics, -q, check_running]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ['/garage', server, --single-node, --default-bucket]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK00000000000000000000000000000001
      GARAGE_DEFAULT_SECRET_KEY: local-only-s3-secret-change-before-production
      GARAGE_DEFAULT_BUCKET: chat-quarantine
    volumes: ['./garage.toml:/etc/garage.toml:ro', garage-meta:/var/lib/garage/meta, garage-data:/var/lib/garage/data]
    ports: ['127.0.0.1:3900:3900']
    healthcheck:
      test: ['CMD', /garage, status]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
    healthcheck:
      test: ['CMD', /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  livekit:
    profiles: [media]
    image: livekit/livekit-server:v1.13.9
    command: [--config, /etc/livekit.yaml]
    volumes: ['./livekit.yaml:/etc/livekit.yaml:ro']
    ports: ['127.0.0.1:7880:7880', '127.0.0.1:7881:7881', '127.0.0.1:7882:7882/udp']
    # The image has no portable curl/wget health probe; real API probe belongs in Phase 07.
    restart: unless-stopped
  clamav:
    profiles: [scanner]
    image: clamav/clamav:1.5.4
    ports: ['127.0.0.1:3310:3310']
    volumes: [clamav-data:/var/lib/clamav]
    healthcheck:
      test: ['CMD', /usr/local/bin/clamdcheck.sh]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 180s
    mem_limit: 2g
    cpus: 1.0
    restart: unless-stopped
volumes:
  mongo-data:
  rabbit-data:
  garage-meta:
  garage-data:
  clamav-data:
