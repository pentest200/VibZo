# Local-only single-node dependencies. NOT a production deployment.
name: commonroom-local
services:
  mongo:
    image: mongo:8.0.32@sha256:d0d926f94df099bff534b7ee5b5986458131a22489dfff8664509af0c1e2ca9c
    command: [mongod, --replSet, rs0, --bind_ip_all, --oplogSize, '256']
    ports: ['127.0.0.1:27017:27017']
    volumes: [mongo-data:/data/db]
    healthcheck:
      # Idempotent dev-only initialization; health requires writable primary, not merely TCP.
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'try { rs.status() } catch (e) { if (e.codeName === "NotYetInitialized") rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); else throw e; } if (!db.hello().isWritablePrimary) quit(1);']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: [redis-server, --requirepass, local-only-redis-password, --maxmemory, 256mb, --maxmemory-policy, noeviction]
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH=local-only-redis-password redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine@sha256:3ef7f7e89fed709a78f79b8b5f4e30e1312a1d4089da752e23595566d9d61a95
    environment:
      RABBITMQ_DEFAULT_USER: chat
      RABBITMQ_DEFAULT_PASS: local-only-rabbit-password
      RABBITMQ_DEFAULT_VHOST: chat
    ports: ['127.0.0.1:5672:5672', '127.0.0.1:15672:15672']
    volumes: [rabbit-data:/var/lib/rabbitmq]
    healthcheck:
      test: ['CMD', rabbitmq-diagnostics, -q, check_running]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ['/garage', server, --single-node, --default-bucket]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK00000000000000000000000000000001
      GARAGE_DEFAULT_SECRET_KEY: local-only-s3-secret-change-before-production
      GARAGE_DEFAULT_BUCKET: chat-quarantine
    volumes: ['./garage.toml:/etc/garage.toml:ro', garage-meta:/var/lib/garage/meta, garage-data:/var/lib/garage/data]
    ports: ['127.0.0.1:3900:3900']
    healthcheck:
      test: ['CMD', /garage, status]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    # Local/CI delivery must not depend on external PTR lookup latency.
    command: [--smtp-disable-rdns]
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
    healthcheck:
      test: ['CMD', /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  livekit:
    profiles: [media]
    image: livekit/livekit-server:v1.13.9
    command: [--config, /etc/livekit.yaml]
    volumes: ['./livekit.yaml:/etc/livekit.yaml:ro']
    ports: ['127.0.0.1:7880:7880', '127.0.0.1:7881:7881', '127.0.0.1:7882:7882/udp']
    # The image has no portable curl/wget health probe; real API probe belongs in Phase 07.
    restart: unless-stopped
  clamav:
    profiles: [scanner]
    image: clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
    ports: ['127.0.0.1:3310:3310']
    networks: [scanning]
    volumes: [clamav-data:/var/lib/clamav]
    environment:
      CLAMD_CONF_StreamMaxLength: 25M
      CLAMD_CONF_MaxFileSize: 25M
      CLAMD_CONF_MaxScanSize: 64M
      CLAMD_CONF_MaxRecursion: 8
      CLAMD_CONF_MaxFiles: 128
      CLAMD_CONF_MaxScanTime: 20000
      CLAMD_CONF_MaxThreads: 1
      CLAMD_CONF_MaxQueue: 4
      CLAMD_CONF_ReadTimeout: 30
      CLAMD_CONF_AlertExceedsMax: 'yes'
      CLAMD_CONF_AlertEncrypted: 'yes'
      CLAMD_CONF_ConcurrentDatabaseReload: 'no'
    healthcheck:
      test: ['CMD', /usr/local/bin/clamdcheck.sh]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 180s
    mem_limit: 2g
    cpus: 1.0
    restart: unless-stopped
  image-processor:
    profiles: [scanner]
    build: ../processor
    image: commonroom-image-processor:0.0.0
    environment:
      IMAGE_PROCESSOR_KEY: local-only-image-processor-key-change-before-production
    networks: [processing]
    read_only: true
    tmpfs: ['/tmp:size=16m,noexec,nosuid']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    init: true
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3003/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  image-proxy:
    profiles: [scanner]
    image: commonroom-image-processor:0.0.0
    command: [node, proxy.mjs]
    depends_on:
      image-processor:
        condition: service_healthy
    ports: ['127.0.0.1:3003:3003']
    networks: [default, processing]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
    init: true
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3003/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

networks:
  scanning: {}
  processing:
    internal: true
volumes:
  mongo-data:
  rabbit-data:
  garage-meta:
  garage-data:
  clamav-data:
