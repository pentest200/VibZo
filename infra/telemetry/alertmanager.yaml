global:
  resolve_timeout: 30s
route:
  receiver: local-only
  group_by: [alertname, dependency, role, queue]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 30m
receivers:
  - name: local-only
    webhook_configs:
      - url: http://telemetry-relay:9465/alerts
        send_resolved: true
        max_alerts: 50
        timeout: 2s
