receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 1048576
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 32
  filter/approved:
    error_mode: propagate
    traces:
      span:
        - 'Len(links) > 0'
        - 'not IsMatch(resource.attributes["service.name"], "^commonroom-(api|gateway|worker)$")'
        - 'not IsMatch(name, "^(http[.]request|outbox[.]publish|broker[.]consume|broker[.]replay|fanout[.]publish|gateway[.]dispatch|email[.]process|invitation[.]expire|attachment[.]process|attachment[.]maintenance|safety[.]process|call[.]webhook|call[.]reconcile|fanout[.]process|outbox[.]process)$")'
      spanevent: ['true']
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - 'keep_keys(resource.attributes, ["service.name", "telemetry.sdk.name", "telemetry.sdk.language", "telemetry.sdk.version"])'
      - 'keep_keys(scope.attributes, [])'
      - 'keep_keys(span.attributes, ["http.request.method", "http.route", "http.response.status_code", "messaging.operation.name", "messaging.subscription.name"])'
      - 'set(span.status.message, "")'
      - 'set(span.trace_state, "")'
  batch:
    timeout: 1s
    send_batch_size: 32
    send_batch_max_size: 64
exporters:
  file:
    path: /traces/traces.json
    rotation:
      max_megabytes: 8
      max_days: 1
      max_backups: 2
service:
  telemetry:
    logs: {level: warn}
    metrics:
      readers:
        - pull:
            exporter:
              prometheus: {host: 0.0.0.0, port: 8888}
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/approved, transform/privacy, batch]
      exporters: [file]
