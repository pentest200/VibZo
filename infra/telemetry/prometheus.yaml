global:
  scrape_interval: 5s
  scrape_timeout: 2s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/rules.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: commonroom
    metrics_path: /metrics/api
    sample_limit: 10000
    label_limit: 12
    static_configs:
      - targets: ['telemetry-relay:9465']
        labels: {role: api}
  - job_name: commonroom-gateway
    metrics_path: /metrics/gateway
    sample_limit: 10000
    label_limit: 12
    static_configs:
      - targets: ['telemetry-relay:9465']
        labels: {role: gateway}
  - job_name: commonroom-worker
    metrics_path: /metrics/worker
    sample_limit: 10000
    label_limit: 12
    static_configs:
      - targets: ['telemetry-relay:9465']
        labels: {role: worker}
  - job_name: commonroom-ops
    metrics_path: /metrics/ops
    sample_limit: 10000
    label_limit: 12
    static_configs:
      - targets: ['telemetry-relay:9465']
        labels: {role: ops}
  - job_name: collector
    static_configs:
      - targets: ['collector:8888']
