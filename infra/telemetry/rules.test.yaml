rule_files: [/etc/prometheus/rules.yaml]
evaluation_interval: 5s
tests:
  - name: enabled-dependency-fails-after-hold
    interval: 5s
    input_series:
      - {series: 'chat_dependency_up{role="ops",dependency="mongodb"}', values: '0+0x5'}
      - {series: 'chat_dependency_enabled{role="ops",dependency="mongodb"}', values: '1+0x5'}
      - {series: 'chat_dependency_observed{role="ops",dependency="mongodb"}', values: '1+0x5'}
      - {series: 'chat_snapshot_fresh{role="ops"}', values: '1+0x5'}
    alert_rule_test:
      - {eval_time: 5s, alertname: CommonroomDependencyUnavailable, exp_alerts: []}
      - eval_time: 15s
        alertname: CommonroomDependencyUnavailable
        exp_alerts:
          - exp_labels: {role: ops, dependency: mongodb, severity: critical}
            exp_annotations: {summary: 'A fresh protocol probe failed; follow the dependency policy.'}
  - name: disabled-push-is-not-a-provider-outage
    interval: 5s
    input_series:
      - {series: 'chat_dependency_up{role="ops",dependency="push"}', values: '0+0x5'}
      - {series: 'chat_dependency_enabled{role="ops",dependency="push"}', values: '0+0x5'}
      - {series: 'chat_dependency_observed{role="ops",dependency="push"}', values: '0+0x5'}
      - {series: 'chat_snapshot_fresh{role="ops"}', values: '1+0x5'}
    alert_rule_test:
      - {eval_time: 20s, alertname: CommonroomDependencyUnavailable, exp_alerts: []}
  - name: stale-observation-does-not-certify-dependency-state
    interval: 5s
    input_series:
      - {series: 'chat_dependency_up{role="ops",dependency="redis"}', values: '0+0x5'}
      - {series: 'chat_dependency_enabled{role="ops",dependency="redis"}', values: '1+0x5'}
      - {series: 'chat_dependency_observed{role="ops",dependency="redis"}', values: '1+0x5'}
      - {series: 'chat_snapshot_fresh{role="ops"}', values: '0+0x5'}
    alert_rule_test:
      - {eval_time: 20s, alertname: CommonroomDependencyUnavailable, exp_alerts: []}
      - eval_time: 20s
        alertname: CommonroomSnapshotStale
        exp_alerts:
          - exp_labels: {role: ops, severity: critical}
            exp_annotations: {summary: 'Host agent snapshot is missing or stale; dependency state is unknown.'}
